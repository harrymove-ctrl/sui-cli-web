<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Set the theme class before first paint to avoid a light->dark flash.
      (function () {
        try {
          if (localStorage.getItem('sui-cli-web-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <meta name="google-site-verification" content="z9eUzSSBzehnOdr1xHU-wrRU_cQ-6kgOiS5nGYQEhZY" />

    <!-- SEO Meta Tags -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <!-- Geist Pixel as the UI typeface (matches the dither-kit pixel aesthetic);
         Geist Sans kept as fallback, Geist Mono for data/code columns. -->

    <!-- Additional SEO -->
    <meta name="application-name" content="Sui CLI Web" />
    <meta name="apple-mobile-web-app-title" content="Sui CLI Web" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body class="bg-background-primary text-text-primary">
    <!-- Critical CSS inline for faster first paint -->
    <style>
      /* Critical CSS - prevents flash of unstyled content */
      :root {
        --background: 0 0% 100%;
        --foreground: 220 15% 12%;
      }
      html.dark {
        --background: 220 10% 6%;
        --foreground: 0 0% 98%;
      }
      body {
        margin: 0;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: 'Geist Pixel', 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
      }
      /* Initial loading spinner */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #eef4fb 0%, #f7fafd 50%, #eef4fb 100%);
        z-index: 9999;
      }
      html.dark .initial-loader {
        background: linear-gradient(135deg, #0a1929 0%, #0d2137 50%, #0a1929 100%);
      }
      .initial-loader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(77, 162, 255, 0.2);
        border-top-color: #4da2ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="root">
      <!-- Show loading spinner until React hydrates -->
      <div class="initial-loader" id="initial-loader">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove initial loader when React is ready
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) loader.style.display = 'none';
        }, 100);
      });
    </script>
  </body>
</html>
