name: Deploy to Railway

# Railway's own GitHub trigger deploys on push, but only while its GitHub App
# holds access to this repo - and that access was lost, so pushes stopped
# building with no error anywhere. This workflow uploads the source itself with
# a project token, which does not depend on the App at all.
#
# The deploy is gated: the `test` job below builds every workspace and runs the
# server suite, and `deploy` declares `needs: test`, so a commit that fails to
# build or fails a test never reaches `railway up`. Keeping the gate as a job in
# THIS workflow - rather than a separate CI workflow chained by workflow_run -
# means it runs on exactly this commit and ref, with no skipped-vs-failed
# ambiguity and no stale-ref race.
#
# Requires a repository secret RAILWAY_TOKEN: a *project* token from
# https://railway.com/account/tokens scoped to sui-cli-web / production.
# Without it the deploy step skips instead of failing, so a fork or a clone
# without the secret does not report a red build for something it was never
# meant to do.

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  # A deploy in flight is worth cancelling when a newer commit lands: the older
  # build would only be overwritten a minute later anyway.
  group: railway-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'harrymove-ctrl/sui-cli-web' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Must be >= 20 for vitest 4; a bad pin here would skip the very tests
          # this gate exists to run and let a broken commit through as "passed".
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (all workspaces)
        run: npm run build

      - name: Test (server - unit + e2e)
        # No `sui` binary on the runner by design - see ci.yml for why.
        run: npm test -w sui-cli-web-server

  deploy:
    runs-on: ubuntu-latest
    # The gate: this is what stops a red build or a failing test from shipping.
    needs: test
    if: ${{ github.repository == 'harrymove-ctrl/sui-cli-web' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard on the deploy token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN is not set - skipping deploy."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install Railway CLI
        if: env.skip != 'true'
        run: npm install -g @railway/cli

      - name: Deploy
        if: env.skip != 'true'
        env:
          # Deliberately not named RAILWAY_TOKEN: the CLI reads that variable
          # directly, and feeding it an account token fails with a flat
          # "Invalid RAILWAY_TOKEN" that says nothing about the token being the
          # wrong *kind*. Railway has two: a project token, which the CLI wants
          # in RAILWAY_TOKEN and which carries its own project context, and an
          # account token, which belongs in RAILWAY_API_TOKEN and needs the
          # project linked explicitly. The secret may hold either, so probe.
          DEPLOY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: b993c667-8d17-47e3-9d39-b80449d2dc94
        # --detach returns once the build is queued. The build itself is long
        # (full monorepo: shared, server, client, marketing, mcp) and holding a
        # runner open to watch it buys nothing the Railway dashboard does not
        # already show.
        run: |
          set -euo pipefail
          if RAILWAY_TOKEN="$DEPLOY_TOKEN" railway status >/dev/null 2>&1; then
            echo "Authenticated with a project token."
            export RAILWAY_TOKEN="$DEPLOY_TOKEN"
          else
            echo "Project token rejected - using it as a workspace token."
            export RAILWAY_API_TOKEN="$DEPLOY_TOKEN"
          fi
          # Project, environment and service are passed explicitly rather than
          # linked first: `railway link` resolves workspaces through the logged-in
          # user and returns Unauthorized under a token, while `up` takes the ids
          # directly and needs no link at all.
          railway up \
            --project "$PROJECT_ID" \
            --environment production \
            --service sui-cli-web \
            --detach
